<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GhostLine Chat</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.1rem; color: #444; }
  #log { border: 1px solid #ccc; border-radius: 8px; height: 400px; overflow-y: auto; padding: 1rem; margin-bottom: 1rem; background: #fafafa; }
  .msg { margin-bottom: 0.75rem; line-height: 1.4; }
  .user { color: #0a5; }
  .ai { color: #333; }
  .label { font-weight: bold; margin-right: 0.4rem; }
  #row { display: flex; gap: 0.5rem; }
  #input { flex: 1; padding: 0.6rem; font-size: 1rem; }
  #send { padding: 0.6rem 1.2rem; font-size: 1rem; cursor: pointer; }
  #status { font-size: 0.85rem; color: #888; margin-bottom: 0.5rem; }
</style>
</head>
<body>
  <h1>GhostLine Chat (test client)</h1>
  <div id="status">Connecting...</div>
  <div id="log"></div>
  <div id="row">
    <input id="input" type="text" placeholder="Type a message..." autocomplete="off">
    <button id="send">Send</button>
  </div>

<script>
  const log = document.getElementById("log");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const status = document.getElementById("status");

  const proto = window.location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${window.location.host}/ws/chat`);

  ws.onopen = () => { status.textContent = "Connected."; };
  ws.onclose = () => { status.textContent = "Disconnected."; };
  ws.onerror = () => { status.textContent = "Connection error."; };

  ws.onmessage = (event) => {
    appendMessage("ai", event.data);
  };

  function appendMessage(who, text) {
    const div = document.createElement("div");
    div.className = `msg ${who}`;
    const label = who === "user" ? "You:" : "AI:";
    div.innerHTML = `<span class="label">${label}</span>${escapeHtml(text)}`;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }

  function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }

  function sendMessage() {
    const text = input.value.trim();
    if (!text || ws.readyState !== WebSocket.OPEN) return;
    appendMessage("user", text);
    ws.send(text);
    input.value = "";
  }

  sendBtn.addEventListener("click", sendMessage);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendMessage();
  });
</script>
</body>
</html>
